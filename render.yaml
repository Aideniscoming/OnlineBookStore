services:
  - type: web
    name: ai-assistance-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
